name: Collecte Vélib

on:
  schedule:
    # Toutes les 15 min, décalé des minutes rondes (GitHub retarde les crons à :00).
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: # bouton "Run workflow" pour lancer à la main

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collecte
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m collector.collect
